[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxswarm"
version = "0.2.0"
description = "Physics-informed multi-objective multi-agent RL for microrobot swarms in fluid channels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Josef Berman" }]
dependencies = [
  "phiflow>=3.4.0",
  "h5py>=3.0.0",
  "torch>=2.0.0",
  "gymnasium>=0.28.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "matplotlib>=3.7.0",
  "Pillow>=9.0.0",
  "tqdm>=4.65.0",
  "tensorboard>=2.13.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
fluxswarm = "fluxswarm.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["fluxswarm*"]
